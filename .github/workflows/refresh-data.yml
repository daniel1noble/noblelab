name: Refresh publications and collaborators

on:
  schedule:
    # 04:12 UTC daily. An odd minute avoids the top-of-hour crush on OpenAlex.
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the Pages deploy after a data commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from OpenAlex
        # Add an ALTMETRIC_KEY repository secret to switch attention scores on.
        env:
          ALTMETRIC_KEY: ${{ secrets.ALTMETRIC_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit if anything changed
        # Pushes made with GITHUB_TOKEN deliberately do not fire `on: push`
        # workflows (GitHub's recursion guard), so the data commits here never
        # reached the live site until the next human push. workflow_dispatch is
        # exempt from that guard, so dispatch the Pages deploy explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "No change in publications or collaborators."
            exit 0
          fi
          git add public/data
          git commit -m "data: refresh publications and collaborators from OpenAlex"
          git push
          gh workflow run pages.yml --ref main
